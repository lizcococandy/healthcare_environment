{% extends "base.html" %}

{% block title %}新增廢棄物記錄 - 醫療環境永續系統{% endblock %}

{% block content %}
<div class="form-container">
    <h1>新增廢棄物管理記錄</h1>
    <form method="POST">
        <div class="form-group">
            <label for="facility_name">設施名稱</label>
            <input type="text" id="facility_name" name="facility_name" required>
        </div>
        <div class="form-group">
            <label for="measurement_date">測量日期</label>
            <input type="date" id="measurement_date" name="measurement_date" required>
        </div>
        <div class="form-group">
            <label for="medical_waste_kg">醫療廢棄物 (kg)</label>
            <input type="number" id="medical_waste_kg" name="medical_waste_kg" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="general_waste_kg">一般廢棄物 (kg)</label>
            <input type="number" id="general_waste_kg" name="general_waste_kg" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="recyclable_waste_kg">可回收廢棄物 (kg)</label>
            <input type="number" id="recyclable_waste_kg" name="recyclable_waste_kg" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="hazardous_waste_kg">有害廢棄物 (kg)</label>
            <input type="number" id="hazardous_waste_kg" name="hazardous_waste_kg" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="notes">備註</label>
            <textarea id="notes" name="notes" rows="4"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">儲存</button>
            <a href="{{ url_for('waste.index') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
