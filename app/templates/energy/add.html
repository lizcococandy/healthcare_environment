{% extends "base.html" %}

{% block title %}新增能源記錄 - 醫療環境永續系統{% endblock %}

{% block content %}
<div class="form-container">
    <h1>新增能源消耗記錄</h1>
    <form method="POST">
        <div class="form-group">
            <label for="facility_name">設施名稱</label>
            <input type="text" id="facility_name" name="facility_name" required>
        </div>
        <div class="form-group">
            <label for="measurement_date">測量日期</label>
            <input type="date" id="measurement_date" name="measurement_date" required>
        </div>
        <div class="form-group">
            <label for="electricity_kwh">電力消耗 (kWh)</label>
            <input type="number" id="electricity_kwh" name="electricity_kwh" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="natural_gas_m3">天然氣消耗 (m³)</label>
            <input type="number" id="natural_gas_m3" name="natural_gas_m3" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="fuel_oil_liters">燃油消耗 (公升)</label>
            <input type="number" id="fuel_oil_liters" name="fuel_oil_liters" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
            <label for="notes">備註</label>
            <textarea id="notes" name="notes" rows="4"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">儲存</button>
            <a href="{{ url_for('energy.index') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
